title: Credential dumping tool or technique on command line
id: credential_dump_commandline
attack: T1003
severity: critical
description: Command line contains known credential theft strings.
detection:
  EventID: {equals: "1"}
  CommandLine:
    contains_any:
      - sekurlsa
      - logonpasswords
      - 'comsvcs.dll'
      - minidump
      - 'lsass.dmp'
      - '-ma lsass'
      - mimikatz
      - dumpcreds
      - 'privilege::debug'
      - lazagne
      - 'wce.exe'
