title: Scheduled task created
id: scheduled_task_creation
attack: T1053.005
severity: medium
description: Scheduled tasks are a durable persistence and lateral movement mechanism.
detection:
  EventID: {equals: "1"}
  Image: {contains_any: [schtasks.exe, 'at.exe']}
  CommandLine: {contains_any: ['/create', '/sc ', '/tn ']}
